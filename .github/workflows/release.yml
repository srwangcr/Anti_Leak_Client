name: Release multiplataforma

# Se dispara al crear un tag de versión, ej: git tag v0.1.0 && git push --tags
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'   # produce .dmg / .app (Apple Silicon + Intel)
          - platform: 'ubuntu-latest'  # produce .deb / .AppImage / .rpm
          - platform: 'windows-latest' # produce .msi / .exe

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias de sistema (solo Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias de Node
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Anti Leak Client ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
