[package]
name = "anti_leak_client"
version = "0.2.0"
edition = "2021"
build = "build.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.24"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
walkdir = "2"
rusqlite = { version = "0.43", features = ["bundled"] }
keyring = "3.6"
exif = { package = "kamadak-exif", version = "0.6" }
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "anti_leak_client"
path = "src/lib.rs"

[[bin]]
name = "anti_leak_client"
path = "src/main.rs"
